<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>[YOUR NAME] — AI/ML Engineer Portfolio</title>
    <meta name="title" content="[YOUR NAME] — AI/ML Engineer Portfolio" />
    <meta name="description" content="AI/ML Engineer with 5+ years of experience designing, building, deploying, and optimizing intelligent systems and production-grade machine learning solutions." />
    <meta name="keywords" content="AI Engineer, Machine Learning Engineer, MLOps, LLMs, Generative AI, PyTorch, Deep Learning, Data Engineering" />
    <meta name="author" content="[YOUR NAME]" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://[YOUR_DOMAIN_OR_GITHUB_PAGES_URL]/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://[YOUR_DOMAIN_OR_GITHUB_PAGES_URL]/" />
    <meta property="og:title" content="[YOUR NAME] — AI/ML Engineer Portfolio" />
    <meta property="og:description" content="AI/ML Engineer with 5+ years of experience building intelligent systems, machine learning solutions, and production AI applications." />
    <meta property="og:image" content="./assets/images/profile-placeholder.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://[YOUR_DOMAIN_OR_GITHUB_PAGES_URL]/" />
    <meta property="twitter:title" content="[YOUR NAME] — AI/ML Engineer Portfolio" />
    <meta property="twitter:description" content="AI/ML Engineer with 5+ years of experience building intelligent systems, machine learning solutions, and production AI applications." />
    <meta property="twitter:image" content="./assets/images/profile-placeholder.jpg" />

    <!-- JSON-LD Structured Data (Person Schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "[YOUR NAME]",
        "jobTitle": "AI/ML Engineer",
        "description": "AI/ML Engineer with 5+ years of professional experience designing and deploying scalable machine learning systems.",
        "url": "https://[YOUR_DOMAIN_OR_GITHUB_PAGES_URL]/",
        "sameAs": [
          "https://github.com/[YOUR_GITHUB_USERNAME]",
          "https://linkedin.com/in/[YOUR_LINKEDIN_USERNAME]"
        ],
        "knowsAbout": [
          "Machine Learning",
          "Generative AI",
          "Large Language Models",
          "MLOps",
          "Deep Learning",
          "Computer Vision",
          "Natural Language Processing",
          "PyTorch"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
